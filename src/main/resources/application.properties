spring.application.name=hasil-app
server.port=${PORT:8083}
grpc.server.port=${GRPC_PORT:9093}

spring.datasource.url=${NEON_DB_URL}
spring.datasource.username=${NEON_DB_USERNAME}
spring.datasource.password=${NEON_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

pembayaran.base-url=${PEMBAYARAN_BASE_URL:http://localhost:8085}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always

jwt.secret=${JWT_SECRET:mysecretkeymysecretkeymysecretkeymysecretkeymysecretkeymysecretkeymysecretkey}
